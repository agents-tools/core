name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift Package
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          swift --version
          xcrun swift-format --version

      - name: Format
        run: xcrun swift-format lint --configuration .swift-format --recursive Package.swift Sources Tests

      - name: Test
        run: swift test

      - name: Diff Check
        run: git diff --check

      - name: Release Build
        run: swift build -c release
