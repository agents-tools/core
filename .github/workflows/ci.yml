name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: agents-tools/.github/.github/workflows/swift-package-ci.yml@d88103a9a576c9cfe9561a5d58c803255fea72f4 # v0.1.0
    with:
      runner: macos-26
      package-directory: .
      format-configuration: .swift-format

  presentation:
    uses: agents-tools/.github/.github/workflows/presentation.yml@d88103a9a576c9cfe9561a5d58c803255fea72f4 # v0.1.0
