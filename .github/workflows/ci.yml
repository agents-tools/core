name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: agents-tools/.github/.github/workflows/swift-package-ci.yml@301c132794cbee950bfca6ba83987975d1ea6917
    with:
      runner: macos-26
      package-directory: .
      format-configuration: .swift-format
