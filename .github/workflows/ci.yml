name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: agents-tools/.github/.github/workflows/swift-package-ci.yml@c748c42410ded7d6419b92b2603e7882e6087311
    with:
      runner: macos-26
      package-directory: .
      format-configuration: .swift-format

  presentation:
    uses: agents-tools/.github/.github/workflows/presentation.yml@c748c42410ded7d6419b92b2603e7882e6087311
