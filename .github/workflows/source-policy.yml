name: Source policy

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    if: github.event_name != 'push' || !github.event.deleted
    uses: agents-tools/.github/.github/workflows/policy.yml@c748c42410ded7d6419b92b2603e7882e6087311
