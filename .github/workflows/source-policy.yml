name: Source policy

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    if: github.event_name != 'push' || !github.event.deleted
    uses: agents-tools/github-workflows/.github/workflows/policy.yml@f5d8edff9e7230ffe93006a0c50edf1e19bd625d
    with:
      allow-terms: |
        ChatGPT
        Claude
        Codex
        Cursor
      dependabot-exception: true
