name: Source policy

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    if: github.event_name != 'push' || !github.event.deleted
    uses: agents-tools/github-workflows/.github/workflows/policy.yml@314a41dcae51ff835a9418acfde6542d970b7f16
    with:
      allow-terms: |
        ChatGPT
        Claude
        Codex
        Cursor
      dependabot-exception: true
